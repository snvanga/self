name: Cleanup ECS Fullstack AWS Resources

on:
  push:
    branches:
      - main
      - snv-test
  workflow_dispatch:

concurrency:
  group: repository-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  cleanup:
    name: Delete ECS Fullstack Resources
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify AWS account
        run: aws sts get-caller-identity

      # ==========================================================
      # ECS SERVICES
      # ==========================================================
      - name: Delete ECS services
        run: |
          set +e
          for SERVICE in ecs-fullstack-client ecs-fullstack-server; do
            echo "Checking ECS service: $SERVICE"
            aws ecs describe-services --cluster ecs-fullstack --services "$SERVICE" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              aws ecs update-service --cluster ecs-fullstack --service "$SERVICE" --desired-count 0
              aws ecs wait services-stable --cluster ecs-fullstack --services "$SERVICE"
              aws ecs delete-service --cluster ecs-fullstack --service "$SERVICE" --force
            else
              echo "ECS service $SERVICE does not exist. Skipping."
            fi
          done

      # ==========================================================
      # ECS CLUSTER
      # ==========================================================
      - name: Delete ECS cluster
        run: |
          set +e
          ARN=$(aws ecs describe-clusters --clusters ecs-fullstack --query 'clusters[0].clusterArn' --output text 2>/dev/null)
          if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
            aws ecs delete-cluster --cluster ecs-fullstack
          else
            echo "ECS cluster does not exist. Skipping."
          fi

      # ==========================================================
      # CODEDEPLOY
      # ==========================================================
      - name: Delete CodeDeploy resources
        run: |
          set +e

          for APP in Deploy-ecs-fullstack-client Deploy-ecs-fullstack-server; do
            echo "Checking CodeDeploy application: $APP"

            EXISTS=$(aws deploy get-application --application-name "$APP" >/dev/null 2>&1; echo $?)

            if [ "$EXISTS" -ne 0 ]; then
              echo "CodeDeploy application $APP does not exist. Skipping."
              continue
            fi

            GROUPS=$(aws deploy list-deployment-groups \
              --application-name "$APP" \
              --query 'deploymentGroups[]' \
              --output text 2>/dev/null)

            if [ -n "$GROUPS" ] && [ "$GROUPS" != "None" ]; then
              for GROUP in $GROUPS; do
                echo "Deleting CodeDeploy deployment group: $GROUP"
                aws deploy delete-deployment-group \
                  --application-name "$APP" \
                  --deployment-group-name "$GROUP" || true
              done
            fi

            echo "Deleting CodeDeploy application: $APP"
            aws deploy delete-application \
              --application-name "$APP" || true
          done

      # ==========================================================
      # ECR
      # ==========================================================
      - name: Delete ECR repositories
        run: |
          set +e
          for REPO in repo-client repo-server; do
            echo "Checking ECR repository: $REPO"

            aws ecr describe-repositories \
              --repository-names "$REPO" >/dev/null 2>&1

            if [ $? -eq 0 ]; then
              aws ecr delete-repository \
                --repository-name "$REPO" \
                --force
            else
              echo "ECR repository $REPO does not exist. Skipping."
            fi
          done

      # ==========================================================
      # CLOUDWATCH LOG GROUPS
      # ==========================================================
      - name: Delete CloudWatch Log Groups
        run: |
          set +e

          for LOG_GROUP in \
            /ecs/task-definition-ecs-fullstack-client \
            /ecs/task-definition-ecs-fullstack-server
          do
            echo "Checking CloudWatch Log Group: $LOG_GROUP"

            aws logs describe-log-groups \
              --log-group-name-prefix "$LOG_GROUP" \
              --query "logGroups[?logGroupName=='$LOG_GROUP'].logGroupName" \
              --output text 2>/dev/null | grep -q "$LOG_GROUP"

            if [ $? -eq 0 ]; then
              echo "Deleting CloudWatch Log Group: $LOG_GROUP"
              aws logs delete-log-group \
                --log-group-name "$LOG_GROUP"
            else
              echo "Log group $LOG_GROUP does not exist. Skipping."
            fi
          done

      # ==========================================================
      # DYNAMODB
      # ==========================================================
      - name: Delete DynamoDB table
        run: |
          set +e

          TABLE="assets-table-ecs-fullstack"

          EXISTS=$(aws dynamodb describe-table \
            --table-name "$TABLE" \
            --query 'Table.TableName' \
            --output text 2>/dev/null)

          if [ "$EXISTS" = "$TABLE" ]; then
            echo "Deleting DynamoDB table: $TABLE"
            aws dynamodb delete-table --table-name "$TABLE"

            echo "Waiting for DynamoDB table deletion..."
            aws dynamodb wait table-not-exists --table-name "$TABLE"
          else
            echo "DynamoDB table does not exist. Skipping."
          fi

      # ==========================================================
      # IAM ROLE POLICIES
      # ==========================================================
      - name: Remove IAM role policies
        run: |
          set +e

          for ROLE in \
            ECS-task-excecution-Role \
            ECS-task-Role \
            CodeDeploy-Role
          do
            echo "Processing IAM role: $ROLE"

            ATTACHED=$(aws iam list-attached-role-policies \
              --role-name "$ROLE" \
              --query 'AttachedPolicies[].PolicyArn' \
              --output text 2>/dev/null)

            for POLICY_ARN in $ATTACHED; do
              if [ -n "$POLICY_ARN" ] && [ "$POLICY_ARN" != "None" ]; then
                echo "Detaching policy: $POLICY_ARN"
                aws iam detach-role-policy \
                  --role-name "$ROLE" \
                  --policy-arn "$POLICY_ARN" || true
              fi
            done

            INLINE=$(aws iam list-role-policies \
              --role-name "$ROLE" \
              --query 'PolicyNames[]' \
              --output text 2>/dev/null)

            for POLICY_NAME in $INLINE; do
              if [ -n "$POLICY_NAME" ] && [ "$POLICY_NAME" != "None" ]; then
                echo "Deleting inline policy: $POLICY_NAME"
                aws iam delete-role-policy \
                  --role-name "$ROLE" \
                  --policy-name "$POLICY_NAME" || true
              fi
            done
          done

      # ==========================================================
      # IAM CUSTOMER MANAGED POLICIES
      # ==========================================================
      - name: Delete ECS customer IAM policies
        run: |
          set +e

          for POLICY in \
            Policy-ECS-task-Role
          do
            echo "Checking IAM policy: $POLICY"

            ARNS=$(aws iam list-policies \
              --scope Local \
              --query "Policies[?PolicyName=='$POLICY'].Arn" \
              --output text 2>/dev/null)

            for ARN in $ARNS; do
              if [ -n "$ARN" ] && [ "$ARN" != "None" ]; then
                echo "Deleting IAM policy: $ARN"

                aws iam list-policy-versions \
                  --policy-arn "$ARN" \
                  --query 'Versions[?IsDefaultVersion==`false`].VersionId' \
                  --output text 2>/dev/null |
                while read VERSION; do
                  if [ -n "$VERSION" ] && [ "$VERSION" != "None" ]; then
                    aws iam delete-policy-version \
                      --policy-arn "$ARN" \
                      --version-id "$VERSION" || true
                  fi
                done

                aws iam delete-policy \
                  --policy-arn "$ARN" || true
              fi
            done
          done

      # ==========================================================
      # IAM ROLES
      # ==========================================================
      - name: Delete IAM roles
        run: |
          set +e

          for ROLE in \
            ECS-task-excecution-Role \
            ECS-task-Role \
            CodeDeploy-Role
          do
            echo "Checking IAM role: $ROLE"

            aws iam get-role \
              --role-name "$ROLE" >/dev/null 2>&1

            if [ $? -eq 0 ]; then
              echo "Deleting IAM role: $ROLE"
              aws iam delete-role \
                --role-name "$ROLE"
            else
              echo "IAM role $ROLE does not exist. Skipping."
            fi
          done

      # ==========================================================
      # LOAD BALANCERS
      # ==========================================================
      - name: Delete Load Balancers
        run: |
          set +e

          for LB in \
            alb-ecs-fullstack-ser \
            alb-ecs-fullstack-cli
          do
            ARN=$(aws elbv2 describe-load-balancers \
              --names "$LB" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null)

            if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
              echo "Deleting Load Balancer: $LB"
              aws elbv2 delete-load-balancer \
                --load-balancer-arn "$ARN"
            else
              echo "Load Balancer $LB does not exist. Skipping."
            fi
          done

      # ==========================================================
      # WAIT FOR LOAD BALANCERS
      # ==========================================================
      - name: Wait for Load Balancers
        run: sleep 30

      # ==========================================================
      # TARGET GROUPS
      # ==========================================================
      - name: Delete Target Groups
        run: |
          set +e

          for TG in \
            tg-ecs-fullstack-c-g \
            tg-ecs-fullstack-c-b \
            tg-ecs-fullstack-s-g \
            tg-ecs-fullstack-s-b
          do
            ARN=$(aws elbv2 describe-target-groups \
              --names "$TG" \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text 2>/dev/null)

            if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
              echo "Deleting Target Group: $TG"
              aws elbv2 delete-target-group \
                --target-group-arn "$ARN"
            else
              echo "Target Group $TG does not exist. Skipping."
            fi
          done

      # ==========================================================
      # VPC / NETWORKING
      # ==========================================================
      - name: Delete VPC networking
        run: |
          set +e

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=ecs-fullstack" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "ecs-fullstack VPC not found. Skipping."
            exit 0
          fi

          echo "Found VPC: $VPC_ID"

          for NAT in $(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC_ID" \
            --query 'NatGateways[].NatGatewayId' \
            --output text 2>/dev/null); do
            echo "Deleting NAT Gateway: $NAT"
            aws ec2 delete-nat-gateway --nat-gateway-id "$NAT"
          done

          sleep 30

          for RT in $(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[].RouteTableId' \
            --output text 2>/dev/null); do

            for ASSOC in $(aws ec2 describe-route-tables \
              --route-table-ids "$RT" \
              --query 'RouteTables[0].Associations[?Main!=`true`].RouteTableAssociationId' \
              --output text 2>/dev/null); do
              aws ec2 disassociate-route-table \
                --association-id "$ASSOC" || true
            done
          done

          for SG in $(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' \
            --output text 2>/dev/null); do
            aws ec2 delete-security-group \
              --group-id "$SG" || true
          done

          for SUBNET in $(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[].SubnetId' \
            --output text 2>/dev/null); do
            aws ec2 delete-subnet \
              --subnet-id "$SUBNET" || true
          done

          aws ec2 delete-vpc --vpc-id "$VPC_ID" || true

      # ==========================================================
      # FINAL VERIFICATION
      # ==========================================================
      - name: Cleanup verification
        run: |
          echo "========================================"
          echo "AWS CLEANUP COMPLETED"
          echo "========================================"

          echo "ECS:"
          aws ecs list-clusters

          echo "ECR:"
          aws ecr describe-repositories 2>/dev/null || true

          echo "DynamoDB:"
          aws dynamodb list-tables

          echo "CodeDeploy:"
          aws deploy list-applications

          echo "CloudWatch:"
          aws logs describe-log-groups \
            --log-group-name-prefix "/ecs/task-definition-ecs-fullstack" \
            --query 'logGroups[].logGroupName' \
            --output text || true

          echo "VPC:"
          aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=ecs-fullstack" \
            --query 'Vpcs[].VpcId' \
            --output text || true

          echo "========================================"
          echo "Cleanup verification completed"
          echo "========================================"