name: AWS Cleanup

on:
  push:
    branches:
      - main
      - snv-test
  workflow_dispatch:

concurrency:
  group: repository-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  cleanup:
    name: Cleanup ECS Fullstack AWS Resources
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify AWS account
        run: |
          aws sts get-caller-identity
          echo "Region: $AWS_REGION"

      # ==========================================================
      # ECS SERVICES
      # ==========================================================

      - name: Delete ECS services
        run: |
          CLUSTER="ecs-fullstack"

          for SERVICE in ecs-fullstack-client ecs-fullstack-server; do
            echo "Processing ECS service: $SERVICE"

            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --desired-count 0 2>/dev/null || true

            aws ecs delete-service \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --force 2>/dev/null || true
          done

          for i in {1..30}; do
            COUNT=$(aws ecs list-services \
              --cluster "$CLUSTER" \
              --query 'serviceArns | length(@)' \
              --output text 2>/dev/null || echo 0)

            if [ "$COUNT" = "0" ]; then
              echo "All ECS services deleted."
              break
            fi

            echo "Waiting for ECS services to disappear..."
            sleep 10
          done

      
      # ECS CLUSTER
      # ==========================================================

      - name: Delete ECS cluster
        run: |
          aws ecs delete-cluster \
            --cluster ecs-fullstack 2>/dev/null || true

      # ==========================================================
      # CODEDEPLOY - STOP ACTIVE DEPLOYMENTS
      # ==========================================================

      - name: Stop CodeDeploy deployments
        run: |
          for APP in \
            Deploy-ecs-fullstack-client \
            Deploy-ecs-fullstack-server
          do
            echo "Checking CodeDeploy application: $APP"

            DEPLOYMENTS=$(aws deploy list-deployments \
              --application-name "$APP" \
              --include-only-statuses \
              Created Queued InProgress \
              --query 'deployments[]' \
              --output text 2>/dev/null || true)

            for DEPLOYMENT in $DEPLOYMENTS; do
              echo "Stopping deployment: $DEPLOYMENT"

              aws deploy stop-deployment \
                --deployment-id "$DEPLOYMENT" \
                --auto-rollback-enabled 2>/dev/null || true
            done
          done

      # ==========================================================
      # CODEDEPLOY DEPLOYMENT GROUPS
      # ==========================================================

      - name: Delete CodeDeploy deployment groups
        run: |
          for APP in \
            Deploy-ecs-fullstack-client \
            Deploy-ecs-fullstack-server
          do
            GROUPS=$(aws deploy list-deployment-groups \
              --application-name "$APP" \
              --query 'deploymentGroups[]' \
              --output text 2>/dev/null || true)

            for GROUP in $GROUPS; do
              echo "Deleting CodeDeploy group: $GROUP"

              aws deploy delete-deployment-group \
                --application-name "$APP" \
                --deployment-group-name "$GROUP" 2>/dev/null || true
            done
          done

      # ==========================================================
      # CODEDEPLOY APPLICATIONS
      # ==========================================================

      - name: Delete CodeDeploy applications
        run: |
          for APP in \
            Deploy-ecs-fullstack-client \
            Deploy-ecs-fullstack-server
          do
            echo "Deleting CodeDeploy application: $APP"

            aws deploy delete-application \
              --application-name "$APP" 2>/dev/null || true
          done

      # ==========================================================
      # ECR
      # ==========================================================

      - name: Delete ECR repositories
        run: |
          for REPO in repo-client repo-server; do
            echo "Deleting ECR repository: $REPO"

            aws ecr delete-repository \
              --repository-name "$REPO" \
              --force 2>/dev/null || true
          done

      # ==========================================================
      # CLOUDWATCH LOG GROUPS
      # ==========================================================

      - name: Delete CloudWatch log groups
        run: |
          for LOG_GROUP in \
            /ecs/task-definition-ecs-fullstack-client \
            /ecs/task-definition-ecs-fullstack-server
          do
            echo "Deleting log group: $LOG_GROUP"

            aws logs delete-log-group \
              --log-group-name "$LOG_GROUP" 2>/dev/null || true
          done

      # ==========================================================
      # DYNAMODB
      # ==========================================================

      - name: Delete DynamoDB table
        run: |
          echo "Deleting DynamoDB table..."

          aws dynamodb delete-table \
            --table-name assets-table-ecs-fullstack 2>/dev/null || true

      - name: Wait for DynamoDB deletion
        run: |
          for i in {1..30}; do
            if ! aws dynamodb describe-table \
              --table-name assets-table-ecs-fullstack \
              >/dev/null 2>&1; then
              echo "DynamoDB table deleted."
              break
            fi

            echo "Waiting for DynamoDB table deletion..."
            sleep 5
          done

      # ==========================================================
      # IAM ROLE POLICIES
      # ==========================================================

      - name: Detach IAM policies
        run: |
          for ROLE in \
            ECS-task-excecution-Role \
            ECS-task-Role \
            CodeDeploy-Role
          do
            echo "Processing IAM role: $ROLE"

            ATTACHED=$(aws iam list-attached-role-policies \
              --role-name "$ROLE" \
              --query 'AttachedPolicies[].PolicyArn' \
              --output text 2>/dev/null || true)

            for POLICY_ARN in $ATTACHED; do
              echo "Detaching: $POLICY_ARN"

              aws iam detach-role-policy \
                --role-name "$ROLE" \
                --policy-arn "$POLICY_ARN" 2>/dev/null || true
            done

            INLINE=$(aws iam list-role-policies \
              --role-name "$ROLE" \
              --query 'PolicyNames[]' \
              --output text 2>/dev/null || true)

            for POLICY_NAME in $INLINE; do
              echo "Deleting inline policy: $POLICY_NAME"

              aws iam delete-role-policy \
                --role-name "$ROLE" \
                --policy-name "$POLICY_NAME" 2>/dev/null || true
            done
          done

      # ==========================================================
      # IAM CUSTOMER MANAGED POLICIES
      # ==========================================================

      - name: Delete customer managed IAM policies
        run: |
          for POLICY in \
            Policy-ECS-task-Role
          do
            ARN=$(aws iam list-policies \
              --scope Local \
              --query "Policies[?PolicyName=='$POLICY'].Arn | [0]" \
              --output text 2>/dev/null || true)

            if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
              echo "Deleting IAM policy: $POLICY"

              VERSIONS=$(aws iam list-policy-versions \
                --policy-arn "$ARN" \
                --query 'Versions[?IsDefaultVersion==`false`].VersionId' \
                --output text 2>/dev/null || true)

              for VERSION in $VERSIONS; do
                aws iam delete-policy-version \
                  --policy-arn "$ARN" \
                  --version-id "$VERSION" 2>/dev/null || true
              done

              aws iam delete-policy \
                --policy-arn "$ARN" 2>/dev/null || true
            fi
          done

      # ==========================================================
      # IAM ROLES
      # ==========================================================

      - name: Delete IAM roles
        run: |
          for ROLE in \
            ECS-task-excecution-Role \
            ECS-task-Role \
            CodeDeploy-Role
          do
            echo "Deleting IAM role: $ROLE"

            aws iam delete-role \
              --role-name "$ROLE" 2>/dev/null || true
          done

      # ==========================================================
      # LOAD BALANCERS
      # ==========================================================

      - name: Delete Load Balancers
        run: |
          for LB in \
            alb-ecs-fullstack-ser \
            alb-ecs-fullstack-cli
          do
            ARN=$(aws elbv2 describe-load-balancers \
              --names "$LB" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null || true)

            if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
              echo "Deleting Load Balancer: $LB"

              aws elbv2 delete-load-balancer \
                --load-balancer-arn "$ARN" 2>/dev/null || true
            fi
          done

      # ==========================================================
      # WAIT FOR LOAD BALANCERS
      # ==========================================================

      - name: Wait for Load Balancers
        run: |
          echo "Waiting for ALBs to be deleted..."
          sleep 30

      # ==========================================================
      # TARGET GROUPS
      # ==========================================================

      - name: Delete Target Groups
        run: |
          for TG in \
            tg-ecs-fullstack-c-g \
            tg-ecs-fullstack-c-b \
            tg-ecs-fullstack-s-g \
            tg-ecs-fullstack-s-b
          do
            ARN=$(aws elbv2 describe-target-groups \
              --names "$TG" \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text 2>/dev/null || true)

            if [ "$ARN" != "None" ] && [ -n "$ARN" ]; then
              echo "Deleting Target Group: $TG"

              aws elbv2 delete-target-group \
                --target-group-arn "$ARN" 2>/dev/null || true
            fi
          done

      # ==========================================================
      # FIND ECS VPC
      # ==========================================================

      - name: Find ECS Fullstack VPC
        id: vpc
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters \
              "Name=cidr-block,Values=10.120.0.0/16" \
              "Name=tag:Name,Values=ecs-fullstack" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null || true)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "No ecs-fullstack VPC found."
            echo "vpc_id=" >> "$GITHUB_OUTPUT"
          else
            echo "Found VPC: $VPC_ID"
            echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          fi

      # ==========================================================
      # NAT GATEWAYS
      # ==========================================================

      - name: Delete NAT Gateways
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          NAT_IDS=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC_ID" \
            --query 'NatGateways[?State!=`deleted`].NatGatewayId' \
            --output text 2>/dev/null || true)

          for NAT in $NAT_IDS; do
            echo "Deleting NAT Gateway: $NAT"

            aws ec2 delete-nat-gateway \
              --nat-gateway-id "$NAT" 2>/dev/null || true
          done

          if [ -n "$NAT_IDS" ]; then
            echo "Waiting for NAT Gateways..."
            sleep 30
          fi

      # ==========================================================
      # RELEASE ELASTIC IPS
      # ==========================================================

      - name: Release Elastic IPs
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          ALLOCATIONS=$(aws ec2 describe-addresses \
            --filters "Name=domain,Values=vpc" \
            --query 'Addresses[?AssociationId==null].AllocationId' \
            --output text 2>/dev/null || true)

          for ALLOCATION in $ALLOCATIONS; do
            echo "Releasing EIP: $ALLOCATION"

            aws ec2 release-address \
              --allocation-id "$ALLOCATION" 2>/dev/null || true
          done

      # ==========================================================
      # INTERNET GATEWAY
      # ==========================================================

      - name: Delete Internet Gateway
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          IGW_IDS=$(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query 'InternetGateways[].InternetGatewayId' \
            --output text 2>/dev/null || true)

          for IGW in $IGW_IDS; do
            echo "Detaching Internet Gateway: $IGW"

            aws ec2 detach-internet-gateway \
              --internet-gateway-id "$IGW" \
              --vpc-id "$VPC_ID" 2>/dev/null || true

            echo "Deleting Internet Gateway: $IGW"

            aws ec2 delete-internet-gateway \
              --internet-gateway-id "$IGW" 2>/dev/null || true
          done

      # ==========================================================
      # ROUTE TABLES
      # ==========================================================

      - name: Delete Route Tables
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          ROUTE_TABLES=$(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[].RouteTableId' \
            --output text 2>/dev/null || true)

          for RT in $ROUTE_TABLES; do
            MAIN=$(aws ec2 describe-route-tables \
              --route-table-ids "$RT" \
              --query 'RouteTables[0].Associations[?Main==`true`].Main' \
              --output text 2>/dev/null || true)

            if [ "$MAIN" != "True" ]; then
              echo "Deleting Route Table: $RT"

              aws ec2 delete-route-table \
                --route-table-id "$RT" 2>/dev/null || true
            fi
          done

      # ==========================================================
      # SUBNETS
      # ==========================================================

      - name: Delete Subnets
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'Subnets[].SubnetId' \
            --output text 2>/dev/null || true)

          for SUBNET in $SUBNETS; do
            echo "Deleting Subnet: $SUBNET"

            aws ec2 delete-subnet \
              --subnet-id "$SUBNET" 2>/dev/null || true
          done

      # ==========================================================
      # SECURITY GROUPS
      # ==========================================================

      - name: Delete Security Groups
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          GROUPS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' \
            --output text 2>/dev/null || true)

          for SG in $GROUPS; do
            echo "Deleting Security Group: $SG"

            aws ec2 delete-security-group \
              --group-id "$SG" 2>/dev/null || true
          done

      # ==========================================================
      # DELETE VPC
      # ==========================================================

      - name: Delete VPC
        if: steps.vpc.outputs.vpc_id != ''
        run: |
          VPC_ID="${{ steps.vpc.outputs.vpc_id }}"

          echo "Deleting VPC: $VPC_ID"

          aws ec2 delete-vpc \
            --vpc-id "$VPC_ID"

          echo "VPC deletion requested."

      # ==========================================================
      # FINAL VERIFICATION
      # ==========================================================

      - name: Cleanup verification
        run: |
          echo "=============================================="
          echo "AWS CLEANUP VERIFICATION"
          echo "=============================================="

          echo ""
          echo "ECS clusters:"
          aws ecs list-clusters

          echo ""
          echo "ECR repositories:"
          aws ecr describe-repositories 2>/dev/null || true

          echo ""
          echo "DynamoDB tables:"
          aws dynamodb list-tables

          echo ""
          echo "CodeDeploy applications:"
          aws deploy list-applications

          echo ""
          echo "Target groups:"
          aws elbv2 describe-target-groups 2>/dev/null || true

          echo ""
          echo "VPC:"
          aws ec2 describe-vpcs \
            --filters \
              "Name=cidr-block,Values=10.120.0.0/16" \
              "Name=tag:Name,Values=ecs-fullstack" \
            --query 'Vpcs[].VpcId' \
            --output text 2>/dev/null || true

          echo ""
          echo "=============================================="
          echo "CLEANUP COMPLETED"
          echo "=============================================="