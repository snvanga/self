name: AWS Monitoring Infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: false
        default: 'apply'
      enable_grafana_health_check:
        description: 'Enable Grafana HTTP health check after apply'
        required: false
        default: 'false'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - siva-test
permissions:
  contents: read
jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_VAR_enable_ssh_health_check: 'false'
      GRAFANA_HEALTH_CHECK_ENABLED: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_grafana_health_check == 'true' && 'true' || 'false' }}"
      ACTION: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action != '' && github.event.inputs.action || 'apply' }}"
    defaults:
      run:
        working-directory: aws-monitoring-platform/terraform
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Format
        run: terraform fmt -check
      - name: Terraform Validate
        run: |
          if [ -f terraform.tfvars ]; then
            terraform validate -var-file=terraform.tfvars
          else
            echo "Skipping validate: terraform.tfvars not found"
          fi
      - name: Terraform Execute
        run: |
          if [ ! -f terraform.tfvars ]; then
            echo "Skipping ${ACTION}: terraform.tfvars not found"
            exit 0
          fi

          case "${ACTION}" in
            plan)
              terraform plan -var-file=terraform.tfvars -input=false
              ;;
            apply)
              terraform apply -var-file=terraform.tfvars -auto-approve
              ;;
            destroy)
              terraform destroy -var-file=terraform.tfvars -auto-approve
              ;;
            *)
              echo "Unknown ACTION '${ACTION}'. Supported values: plan, apply, destroy"
              exit 1
              ;;
          esac

      - name: Get public IP
        if: env.ACTION == 'apply'
        run: |
          echo "PUBLIC_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV
      - name: Wait for Grafana
        if: env.ACTION == 'apply' && env.GRAFANA_HEALTH_CHECK_ENABLED == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 http://$PUBLIC_IP:3000/api/health; then
              echo "Grafana is ready"
              exit 0
            fi
            echo "Grafana not ready yet; sleeping..."
            sleep 10
          done
          echo "Grafana did not become ready within 2 minutes"
          exit 1
