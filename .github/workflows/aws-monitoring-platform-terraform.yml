name: AWS Monitoring Infrastructure
on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - siva-test
permissions:
  contents: read
jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_VAR_enable_ssh_health_check: 'false'
      GRAFANA_HEALTH_CHECK_ENABLED: 'false'
    defaults:
      run:
        working-directory: aws-monitoring-platform/terraform
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Format
        run: terraform fmt -check
      - name: Terraform Validate
        run: |
          if [ -f terraform.tfvars ]; then
            terraform validate -var-file=terraform.tfvars
          else
            echo "Skipping validate: terraform.tfvars not found"
          fi
      - name: Terraform Plan
        run: |
          if [ -f terraform.tfvars ]; then
            terraform plan -var-file=terraform.tfvars -input=false
          else
            echo "Skipping plan: terraform.tfvars not found"
          fi
      - name: Terraform Apply
        run: |
          if [ -f terraform.tfvars ]; then
            terraform apply -var-file=terraform.tfvars -auto-approve
          else
            echo "Skipping apply: terraform.tfvars not found"
          fi
      - name: Get public IP
        run: |
          echo "PUBLIC_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV
      - name: Wait for Grafana
        if: env.GRAFANA_HEALTH_CHECK_ENABLED == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 http://$PUBLIC_IP:3000/api/health; then
              echo "Grafana is ready"
              exit 0
            fi
            echo "Grafana not ready yet; sleeping..."
            sleep 10
          done
          echo "Grafana did not become ready within 2 minutes"
          exit 1
      - name: Wait 5 minutes
        run: sleep 300
      - name: Terraform Destroy
        run: |
          if [ -f terraform.tfvars ]; then
            terraform destroy -var-file=terraform.tfvars -auto-approve
          else
            echo "Skipping destroy: terraform.tfvars not found"
          fi
