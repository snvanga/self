name: Deploy ECS Fullstack Application

on:
  push:
    branches:
      - main
      - snv-test

  workflow_dispatch:

permissions:
  contents: read

env:
  # ==========================================================
  # AWS / TERRAFORM
  # ==========================================================

  TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
  TF_VAR_environment_name: ecs-fullstack

  # ==========================================================
  # ECR
  # These MUST match the Terraform ECR module names
  # ==========================================================

  ECR_FRONTEND_REPOSITORY: repo-client
  ECR_BACKEND_REPOSITORY: repo-server

  # ==========================================================
  # ECS
  # These MUST match the Terraform ECS service names
  # ==========================================================

  ECS_CLUSTER: ecs-fullstack
  ECS_FRONTEND_SERVICE: ecs-fullstack-client
  ECS_BACKEND_SERVICE: ecs-fullstack-server


jobs:

  # ==========================================================
  # TERRAFORM
  # ==========================================================

  terraform:
    name: Terraform Infrastructure

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Infrastructure

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # --------------------------------------------------------
      # Verify AWS credentials
      # --------------------------------------------------------

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------------
      # Verify Terraform
      # --------------------------------------------------------

      - name: Terraform Version
        run: terraform version


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:
    name: Build Frontend

    runs-on: ubuntu-latest

    needs: terraform

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build Frontend Docker Image
      # --------------------------------------------------------

      - name: Build Frontend Image
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Code/client
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            .


      # --------------------------------------------------------
      # Push Frontend Image
      # --------------------------------------------------------

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}


      # --------------------------------------------------------
      # Save Frontend Image
      # --------------------------------------------------------

      - name: Save Frontend Image
        run: |
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}" \
            > frontend-image.txt


      # --------------------------------------------------------
      # Upload Image Information
      # --------------------------------------------------------

      - name: Upload Frontend Image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.txt


  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    name: Build Backend

    runs-on: ubuntu-latest

    needs: terraform

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build Backend Docker Image
      # --------------------------------------------------------

      - name: Build Backend Image
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Code/server
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            .


      # --------------------------------------------------------
      # Push Backend Image
      # --------------------------------------------------------

      - name: Push Backend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}


      # --------------------------------------------------------
      # Save Backend Image
      # --------------------------------------------------------

      - name: Save Backend Image
        run: |
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}" \
            > backend-image.txt


      # --------------------------------------------------------
      # Upload Image Information
      # --------------------------------------------------------

      - name: Upload Backend Image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.txt


  # ==========================================================
  # DEPLOY FRONTEND + BACKEND
  # ==========================================================

  deploy:
    name: Deploy to ECS

    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Download Frontend Image Information
      # --------------------------------------------------------

      - name: Download Frontend Image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image


      # --------------------------------------------------------
      # Download Backend Image Information
      # --------------------------------------------------------

      - name: Download Backend Image
        uses: actions/download-artifact@v4
        with:
          name: backend-image


      # --------------------------------------------------------
      # Get Frontend Image
      # --------------------------------------------------------

      - name: Get Frontend Image
        id: frontend
        run: |
          echo "image=$(cat frontend-image.txt)" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Get Backend Image
      # --------------------------------------------------------

      - name: Get Backend Image
        id: backend
        run: |
          echo "image=$(cat backend-image.txt)" >> "$GITHUB_OUTPUT"


      # ========================================================
      # FRONTEND DEPLOYMENT
      # ========================================================

      - name: Get Frontend Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_FRONTEND_SERVICE" \
            --query taskDefinition \
            --output json > frontend-task-definition.json


      - name: Render Frontend Task Definition
        id: frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: Container-client
          image: ${{ steps.frontend.outputs.image }}


      - name: Deploy Frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # ========================================================
      # BACKEND DEPLOYMENT
      # ========================================================

      - name: Get Backend Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_BACKEND_SERVICE" \
            --query taskDefinition \
            --output json > backend-task-definition.json


      - name: Render Backend Task Definition
        id: backend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: Container-server
          image: ${{ steps.backend.outputs.image }}


      - name: Deploy Backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true