name: Deploy ECS Fullstack Application

on:
  workflow_run:
    workflows:
      - "AWS Cleanup"
    types:
      - completed

  workflow_dispatch:
concurrency:
  group: repository-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
  TF_VAR_environment_name: ecs-fullstack

  ECR_FRONTEND_REPOSITORY: repo-client
  ECR_BACKEND_REPOSITORY: repo-server

  ECS_CLUSTER: ecs-fullstack
  ECS_FRONTEND_SERVICE: ecs-fullstack-client
  ECS_BACKEND_SERVICE: ecs-fullstack-server

  TF_IN_AUTOMATION: true

jobs:


  # CHECK CLEANUP STATUS
  # ==========================================================

  cleanup-check:
    name: Verify Cleanup Completed
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:

      - name: Cleanup completed successfully
        run: |
          echo "Previous cleanup workflow completed successfully."
          echo "Starting ECS infrastructure deployment."


  # TERRAFORM APPLY
  # ==========================================================

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: cleanup-check

    defaults:
      run:
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Infrastructure

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    needs: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Docker Image
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Code/client
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}

      - name: Save Frontend Image
        run: |
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}" \
            > frontend-image.txt

      - name: Upload Frontend Image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.txt


  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    needs: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Docker Image
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Code/server
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Backend Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Save Backend Image
        run: |
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}" \
            > backend-image.txt

      - name: Upload Backend Image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.txt


  # ==========================================================
  # DEPLOY
  # ==========================================================

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify ECS Cluster
        run: |
          aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Frontend Image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Download Backend Image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Get Frontend Image
        id: frontend
        run: |
          echo "image=$(cat frontend-image.txt)" >> "$GITHUB_OUTPUT"

      - name: Get Backend Image
        id: backend
        run: |
          echo "image=$(cat backend-image.txt)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # FRONTEND
      # --------------------------------------------------------

      - name: Get Frontend Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_FRONTEND_SERVICE" \
            --query taskDefinition \
            --output json > frontend-task-definition.json

      - name: Render Frontend Task Definition
        id: frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: Container-client
          image: ${{ steps.frontend.outputs.image }}

      - name: Deploy Frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task.outputs.task-definition }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # --------------------------------------------------------
      # BACKEND
      # --------------------------------------------------------

      - name: Get Backend Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_BACKEND_SERVICE" \
            --query taskDefinition \
            --output json > backend-task-definition.json

      - name: Render Backend Task Definition
        id: backend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: Container-server
          image: ${{ steps.backend.outputs.image }}

      - name: Deploy Backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


  # ==========================================================
  # WAIT 2 MINUTES
  # ==========================================================

  wait:
    name: Wait 2 Minutes
    runs-on: ubuntu-latest

    needs: deploy

    steps:

      - name: Wait for testing
        run: |
          echo "Deployment completed successfully."
          echo "Environment will remain available for 2 minutes."
          sleep 120
          echo "2 minutes completed."


  # ==========================================================
  # DESTROY
  # ==========================================================

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    needs:
      - cleanup-check
      - terraform
      - frontend
      - backend
      - deploy
      - wait

    if: ${{ always() }}

    defaults:
      run:
        working-directory: ./amazon-ecs-fullstack-app-terraform-main/Infrastructure

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Check Terraform State
        run: |
          echo "=========================================="
          echo "Terraform resources currently tracked"
          echo "=========================================="

          terraform state list || true

      - name: Terraform Destroy
        run: |
          echo "=========================================="
          echo "DESTROYING TERRAFORM INFRASTRUCTURE"
          echo "=========================================="

          terraform destroy -auto-approve

          echo "=========================================="
          echo "TERRAFORM DESTROY COMPLETED"
          echo "=========================================="